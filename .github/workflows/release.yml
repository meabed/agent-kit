name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Calculate the release without publishing'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  release:
    name: Validate and publish
    if: ${{ github.repository == 'meabed/agent-kit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Validate release metadata
        run: bun run release:check

      - name: Validate resources
        run: bun run validate

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run fmt:check

      - name: Build
        run: bun run build

      - name: Preview npm package
        run: bun publish --dry-run --access public

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN_FLAG: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: bun run release $DRY_RUN_FLAG
